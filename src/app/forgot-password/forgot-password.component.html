<section class="login-sec">
  <div class="container">
    <div class="row justify-content-center align-items-center">
      <div class="col-12"></div>
      <div class="col-lg-5 col-md-6 col-sm-8 col-12">

        <div class="login-form">
          <h2>Bullet Calendar</h2>
          <h3 class="headding-text text-center">Forgot Password</h3>
          <form [formGroup]="forgotPassword" (ngSubmit)="forgotFormSubmit()">
            <div class="form-group my-3">
              <label>Email</label>
              <input type="email" class="form-control" placeholder="Email" formControlName="email">

              <ul class="parsley-errors-list filled" aria-hidden="false"*ngIf="forgotPassword.get('email').invalid && IsSubmitted">

                <li class="parsley-required">Please Enter Email !!</li>

               </ul>
            </div>

            <div class="form-gropu">
              <button type="submit" class="btn btn-submit">Forgot Password</button>
              <a routerLink="/" class="forgot-password">Login</a>
            </div>

          </form>
        </div>

      </div>
    </div>
  </div>
</section>
